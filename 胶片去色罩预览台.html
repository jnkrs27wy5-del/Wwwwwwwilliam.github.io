
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<title>胶片去色罩预览台</title>
<style>
/* SECTION: tokens */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #0a0c0f;
  --bg2: #11151a;
  --panel: #161b21;
  --panel2: #1d242c;
  --line: rgba(255,255,255,.09);
  --line2: rgba(255,255,255,.17);
  --tx: #eff3f7;
  --tx2: #a2afbc;
  --tx3: #6b7885;
  --acc: #ff9d3d;
  --acc2: #3ad6bd;
  --r: 14px;
}
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--tx);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* SECTION: shell */
.app {
  width: 100%;
  max-width: 470px;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}
@media (min-width: 520px) {
  body { padding: 16px 0; align-items: center; }
  .app {
    min-height: 0; height: calc(100vh - 32px); max-height: 930px;
    border: 1px solid var(--line); border-radius: 24px;
    box-shadow: 0 24px 64px rgba(0,0,0,.55);
  }
}

/* SECTION: topbar */
.topbar {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: calc(9px + env(safe-area-inset-top)) 13px 9px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,.04), transparent);
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.mark {
  width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9px;
  background: linear-gradient(135deg, var(--acc), #ff5f6d 48%, var(--acc2));
  display: grid; place-items: center; color: #10131a;
}
.mark svg { width: 17px; height: 17px; display: block; }
.brand h1 { margin: 0; font-size: 14.5px; font-weight: 650; letter-spacing: .2px; white-space: nowrap; }
.brand p { margin: 1px 0 0; font-size: 10.5px; color: var(--tx3); white-space: nowrap; }
.ibtn {
  width: 35px; height: 35px; border-radius: 10px; flex: 0 0 auto;
  background: var(--panel); border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--tx2);
  transition: transform .1s, color .15s, background .15s;
}
.ibtn svg { width: 17px; height: 17px; display: block; }
.ibtn:active { transform: scale(.93); }
.ibtn:disabled { opacity: .35; cursor: not-allowed; }

/* SECTION: stage */
.stage {
  flex: 1 1 auto; min-height: 130px;
  display: flex; align-items: center; justify-content: center;
  padding: 10px 13px 8px;
}
.vf {
  position: relative; width: 100%; height: 100%;
  border-radius: var(--r); overflow: hidden;
  background: #04060a;
  border: 1px solid var(--line2);
  box-shadow: 0 10px 26px rgba(0,0,0,.45);
}
#view { width: 100%; height: 100%; display: block; object-fit: contain; }
.vf.pick { cursor: crosshair; }
.vf.pick::after {
  content: "点击画面取片基色";
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
  padding: 6px 13px; border-radius: 999px;
  background: rgba(10,13,17,.86); border: 1px solid var(--acc2);
  color: var(--acc2); font-size: 11.5px; font-weight: 620; white-space: nowrap;
  z-index: 4; pointer-events: none;
}

/* SECTION: hud */
.hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 2;
  padding: 8px 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 7px;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.5), transparent);
}
.hud[hidden] { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 9px; border-radius: 999px;
  background: rgba(10,13,17,.74); border: 1px solid var(--line2);
  font-size: 10.5px; font-weight: 620; letter-spacing: .2px; white-space: nowrap;
  backdrop-filter: blur(5px);
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); flex: 0 0 auto;
  box-shadow: 0 0 0 3px rgba(255,157,61,.2); animation: pulse 1.7s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.base-swatch {
  width: 14px; height: 14px; border-radius: 4px; flex: 0 0 auto;
  border: 1px solid rgba(255,255,255,.4); background: #e08a3c;
}
.fps { font-size: 10px; color: var(--tx3); font-variant-numeric: tabular-nums; text-align: right; flex: 0 0 auto; align-self: center; }

/* SECTION: placeholder */
.ph {
  position: absolute; inset: 0; z-index: 3;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 22px; text-align: center;
  background: radial-gradient(78% 58% at 50% 34%, rgba(58,214,189,.12), transparent 66%), linear-gradient(158deg, #141a21, #090c10);
  overflow-y: auto;
}
.ph[hidden] { display: none; }
.ph-ico {
  width: 58px; height: 58px; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center; color: var(--acc2);
  background: rgba(255,255,255,.055); border: 1px solid var(--line2);
}
.ph-ico svg { width: 28px; height: 28px; }
.ph h2 { margin: 0; font-size: 15.5px; font-weight: 640; line-height: 1.5; }
.ph p { margin: 0; font-size: 12px; line-height: 1.75; color: var(--tx2); max-width: 300px; }
.ph-acts { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; margin-top: 3px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 15px; border-radius: 11px; min-height: 42px;
  font-size: 12.5px; font-weight: 620;
  background: var(--panel2); border: 1px solid var(--line2); color: var(--tx);
  transition: transform .1s, opacity .15s;
}
.btn svg { width: 15px; height: 15px; flex: 0 0 auto; }
.btn:active { transform: scale(.96); }
.btn.pri {
  background: linear-gradient(135deg, var(--acc), #ff7a45);
  border-color: transparent; color: #17120c;
  box-shadow: 0 5px 16px rgba(255,138,61,.28);
}
.btn:disabled { opacity: .42; cursor: not-allowed; }
.note {
  margin: 1px 0 0; padding: 9px 12px; border-radius: 10px; max-width: 320px; flex: 0 0 auto;
  font-size: 11px; line-height: 1.7; text-align: left;
  background: rgba(255,107,120,.1); border: 1px solid rgba(255,107,120,.3); color: #ffcdd2;
}
.note[hidden] { display: none; }

/* SECTION: flash */
.flash { position: absolute; inset: 0; z-index: 5; background: #fff; opacity: 0; pointer-events: none; }
.flash.on { animation: fl .3s ease-out; }
@keyframes fl { 0%{opacity:.8} 100%{opacity:0} }

/* SECTION: toggles */
.toggles { flex: 0 0 auto; display: flex; gap: 7px; padding: 0 13px 9px; }
.tg {
  flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 8px; border-radius: 11px; min-height: 40px;
  background: var(--panel); border: 1px solid var(--line);
  font-size: 12px; font-weight: 620; color: var(--tx2);
  transition: background .15s, color .15s, border-color .15s;
}
.tg .sw {
  width: 26px; height: 15px; border-radius: 999px; flex: 0 0 auto;
  background: rgba(255,255,255,.16); position: relative; transition: background .18s;
}
.tg .sw::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 11px; height: 11px; border-radius: 50%; background: #fff;
  transition: transform .18s;
}
.tg[aria-pressed="true"] { color: var(--acc2); border-color: rgba(58,214,189,.45); background: rgba(58,214,189,.11); }
.tg[aria-pressed="true"] .sw { background: var(--acc2); }
.tg[aria-pressed="true"] .sw::after { transform: translateX(11px); }

/* SECTION: panel */
.panel {
  flex: 0 0 auto;
  background: var(--panel); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 10px 13px 11px;
}
.p-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.p-title { font-size: 11px; color: var(--tx3); letter-spacing: .4px; flex: 0 0 auto; }
.p-acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.mini {
  padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 620;
  background: var(--panel2); border: 1px solid var(--line2); color: var(--tx2);
  white-space: nowrap; transition: transform .1s, color .15s, border-color .15s;
}
.mini:active { transform: scale(.95); }
.mini.hi { color: var(--acc2); border-color: rgba(58,214,189,.4); }
.mini[aria-pressed="true"] { color: #17120c; background: var(--acc); border-color: var(--acc); }
.mini[hidden] { display: none; }
.sliders { display: flex; flex-direction: column; gap: 7px; max-height: 26vh; overflow-y: auto; }
.sliders::-webkit-scrollbar { width: 0; }
.row { display: grid; grid-template-columns: 66px 1fr 42px; align-items: center; gap: 9px; }
.row label { font-size: 11.5px; color: var(--tx2); white-space: nowrap; }
.row output { font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; color: var(--tx); }
.row.dim label, .row.dim output { color: var(--tx3); }
.row.off { opacity: .4; }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0; background: transparent; cursor: pointer;
}
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 3px; background: var(--line2); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%; margin-top: -6px;
  background: #fff; border: 3px solid var(--acc); box-shadow: 0 2px 6px rgba(0,0,0,.5);
}
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.14); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 3px; background: var(--line2); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--acc); }
.row.dim input[type=range]::-webkit-slider-thumb { border-color: var(--tx3); }
.row.dim input[type=range]::-moz-range-thumb { border-color: var(--tx3); }

/* SECTION: strip */
.strip-wrap { flex: 0 0 auto; padding: 8px 13px 0; }
.strip-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.strip-head span { font-size: 10.5px; color: var(--tx3); letter-spacing: .3px; }
.strip {
  display: flex; gap: 7px; overflow-x: auto; padding-bottom: 3px;
  scrollbar-width: none; min-height: 56px; align-items: center;
}
.strip::-webkit-scrollbar { display: none; }
.strip-empty { font-size: 11px; color: var(--tx3); padding: 17px 2px; }
.strip-empty[hidden] { display: none; }
.th {
  position: relative; flex: 0 0 auto;
  width: 44px; height: 56px; border-radius: 8px; overflow: hidden;
  background: var(--panel2); border: 1px solid var(--line);
}
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.th .dl {
  position: absolute; left: 0; right: 0; bottom: 0; height: 17px;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.82));
}
.th .dl svg { width: 12px; height: 12px; }
.th:active { border-color: var(--acc2); }

/* SECTION: dock */
.dock {
  flex: 0 0 auto;
  padding: 10px 18px calc(11px + env(safe-area-inset-bottom));
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  background: linear-gradient(180deg, var(--bg2), #080a0d);
}
.dock-side { width: 62px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.dock-side .lbl { font-size: 9.5px; color: var(--tx3); white-space: nowrap; }
.shutter {
  width: 66px; height: 66px; border-radius: 50%; flex: 0 0 auto;
  background: rgba(255,255,255,.09); border: 3px solid rgba(255,255,255,.72);
  display: grid; place-items: center; transition: transform .1s, opacity .15s;
}
.shutter::after {
  content: ""; width: 50px; height: 50px; border-radius: 50%;
  background: linear-gradient(135deg, #fff, #dde5ec);
  box-shadow: 0 3px 11px rgba(0,0,0,.45);
}
.shutter:active { transform: scale(.92); }
.shutter:disabled { opacity: .32; cursor: not-allowed; }

/* SECTION: toast */
.toast {
  position: absolute; left: 50%; bottom: 104px; transform: translate(-50%, 12px);
  z-index: 40; max-width: 84%; text-align: center;
  padding: 9px 15px; border-radius: 999px;
  background: rgba(16,20,25,.95); border: 1px solid var(--line2);
  font-size: 12px; font-weight: 560; box-shadow: 0 9px 24px rgba(0,0,0,.5);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { border-color: rgba(255,107,120,.45); color: #ffd3d7; }

/* SECTION: hidden */
#cam { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="app">

  <!-- SECTION: topbar -->
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3.4"/>
          <path d="M2 9h2M20 9h2M2 15h2M20 15h2"/>
        </svg>
      </div>
      <div>
        <h1>胶片去色罩预览台</h1>
        <p>负片实时反相 · 去除片基橙色罩</p>
      </div>
    </div>
    <button class="ibtn" id="btnUploadTop" type="button" title="上传底片照片" aria-label="上传底片照片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/>
        <path d="M21 16l-5-5-6 6-2.5-2.5L3 19"/>
      </svg>
    </button>
  </header>

  <!-- SECTION: stage -->
  <main class="stage">
    <div class="vf" id="vf">
      <canvas id="view" width="640" height="480" aria-label="去色罩预览画面"></canvas>

      <!-- SECTION: hud -->
      <div class="hud" id="hud" hidden>
        <span class="chip"><i class="dot"></i><span id="chipSrcTx">实时取景</span></span>
        <span class="chip" title="当前片基色">
          <i class="base-swatch" id="baseSwatch"></i><span id="baseTx">片基 —</span>
        </span>
        <span class="fps" id="fps">—</span>
      </div>

      <!-- SECTION: placeholder -->
      <div class="ph" id="ph">
        <div class="ph-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3.4"/>
          </svg>
        </div>
        <h2>把镜头对准胶片负片</h2>
        <p>画面会实时反相并减去片基橙色色罩，直接看到正片效果。所有处理都在本机浏览器完成，不会上传任何服务器。</p>
        <div class="ph-acts">
          <button class="btn pri" id="btnStart" type="button" data-primary-action="开启镜头">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
            </svg>
            <span id="btnStartTx">开启镜头</span>
          </button>
          <button class="btn" id="btnUpload" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/>
            </svg>
            <span>上传底片照片</span>
          </button>
        </div>
        <div class="note" id="note" hidden></div>
      </div>

      <div class="flash" id="flash" aria-hidden="true"></div>
    </div>
  </main>

  <!-- SECTION: toggles -->
  <div class="toggles">
    <button class="tg" id="tgInvert" type="button" aria-pressed="true">
      <i class="sw" aria-hidden="true"></i>反相成正片
    </button>
    <button class="tg" id="tgMask" type="button" aria-pressed="true">
      <i class="sw" aria-hidden="true"></i>去除色罩
    </button>
  </div>

  <!-- SECTION: panel -->
  <section class="panel">
    <div class="p-head">
      <span class="p-title">去色罩参数</span>
      <div class="p-acts">
        <button class="mini hi" id="btnAutoBase" type="button">自动检测片基</button>
        <button class="mini" id="btnPick" type="button" aria-pressed="false">吸管取片基</button>
        <button class="mini hi" id="btnAutoGain" type="button">自动灰平衡</button>
      </div>
    </div>
    <div class="sliders" id="sliders"></div>
  </section>

  <!-- SECTION: strip -->
  <div class="strip-wrap">
    <div class="strip-head">
      <span>本次保存的预览图</span>
      <button class="mini" id="btnClear" type="button" hidden>清空</button>
    </div>
    <div class="strip" id="strip">
      <div class="strip-empty" id="stripEmpty">按快门保存当前预览效果</div>
    </div>
  </div>

  <!-- SECTION: dock -->
  <footer class="dock">
    <div class="dock-side">
      <button class="ibtn" id="btnDownloadLast" type="button" aria-label="下载最近一张" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
        </svg>
      </button>
      <span class="lbl">下载最新</span>
    </div>

    <button class="shutter" id="btnShoot" type="button" disabled aria-label="保存预览图" data-primary-action="保存预览图"></button>

    <div class="dock-side">
      <button class="ibtn" id="btnReset" type="button" aria-label="复位全部参数">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
        </svg>
      </button>
      <span class="lbl">复位</span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fileInput" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
  <video id="cam" playsinline muted autoplay></video>
</div>

<script src="assets/engine.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
